<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delete Button — Action Bar</title>
  <style>
    @font-face {
      font-family: 'DIN Condensed';
      src: url('/fonts/DINCondensed-Bold.woff2') format('woff2'),
           url('/fonts/DINCondensed-Bold.woff') format('woff');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --red: #AD3725;
      --red-hover: #962f1f;
      --purple: #4A1863;
      --purple-hover: #3d1452;
      --white: #ffffff;
      --radius-rect: 30px;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #f5f5f4;
      font-family: 'DIN Condensed', system-ui, sans-serif;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .btn-text {
      display: flex;
      flex-direction: column;
      justify-content: center;
      font-family: 'DIN Condensed', system-ui, sans-serif;
      font-size: 18px;
      font-weight: 700;
      line-height: 18px;
      letter-spacing: 0.72px;
      text-transform: uppercase;
      overflow-wrap: break-word;
      text-box-trim: trim-both;
      text-box-edge: cap alphabetic;
    }

    .action-bar {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      width: min(100%, 720px);
      min-height: 96px;
      padding: 24px 48px;
      background-color: var(--white);
    }

    .action-bar--expanded {
      overflow: hidden;
    }

    .action-bar--expanded .action-bar__eclipse-target {
      opacity: 0;
      pointer-events: none;
    }

    .action-bar__eclipse-target {
      transition: opacity 350ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    .action-bar--retracting .action-bar__eclipse-target {
      opacity: 1;
    }

    .action-bar__actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .bar-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 48px;
      padding: 12px 24px;
      border: none;
      background: transparent;
      cursor: pointer;
      white-space: nowrap;
      font-family: inherit;
      border-radius: var(--radius-rect);
    }

    .bar-btn:focus {
      outline: none;
    }

    .bar-btn:focus-visible {
      outline: 3px solid #2563eb;
      outline-offset: 2px;
    }

    .bar-btn--ghost {
      color: var(--purple);
      padding-left: 0;
      padding-right: 0;
    }

    .bar-btn--ghost .btn-text {
      color: var(--purple);
      display: block;
      flex-direction: unset;
      text-box-trim: none;
      text-box-edge: auto;
      line-height: 18px;
      transform: translateY(4px);
    }

    .bar-btn--ghost .bar-btn__icon {
      color: var(--purple);
      flex-shrink: 0;
    }

    .bar-btn--primary {
      background-color: var(--purple);
      color: var(--white);
    }

    .bar-btn--primary .btn-text {
      color: var(--white);
      display: block;
      flex-direction: unset;
      text-box-trim: none;
      text-box-edge: auto;
      line-height: 18px;
      transform: translateY(4px);
    }

    .bar-btn--primary .bar-btn__icon {
      color: var(--white);
      flex-shrink: 0;
    }

    .bar-btn--primary:hover,
    .bar-btn--primary:focus-visible {
      background-color: var(--purple-hover);
    }

    .delete-widget {
      --btn-surface: var(--red);
      --btn-fg: var(--white);
      --btn-bg: var(--red);
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      background-color: var(--btn-surface);
      outline: none;
      overflow: visible;
      flex-shrink: 0;
      z-index: 1;
      border-radius: var(--radius-rect);
      transition:
        width 350ms cubic-bezier(0.4, 0, 0.2, 1),
        background-color 350ms cubic-bezier(0.4, 0, 0.2, 1),
        min-height 350ms cubic-bezier(0.4, 0, 0.2, 1),
        left 350ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    .delete-widget--expanded {
      --btn-bg: var(--purple);
      --btn-surface: var(--purple);
      position: absolute;
      top: 0;
      bottom: 0;
      right: 0;
      left: auto;
      background-color: var(--purple);
      outline: none;
      min-height: 0;
      overflow: hidden;
      z-index: 10;
    }

    .delete-widget:not(.delete-widget--expanded):has(.delete-widget__trigger:hover),
    .delete-widget:not(.delete-widget--expanded):has(.delete-widget__trigger:focus-visible),
    .delete-widget:not(.delete-widget--expanded):has(.delete-widget__trigger:active) {
      --btn-surface: var(--red-hover);
      --btn-fg: var(--white);
      --btn-bg: var(--red-hover);
      background-color: var(--red-hover);
    }

    .delete-widget__trigger {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      min-height: 48px;
      padding: 12px 24px;
      border: none;
      background: transparent;
      color: var(--btn-fg);
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 350ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    .delete-widget__trigger .btn-text {
      color: var(--btn-fg);
    }

    .delete-widget__trigger:focus {
      outline: none;
    }

    .delete-widget__trigger:focus-visible {
      outline: 3px solid #2563eb;
      outline-offset: 2px;
    }

    .delete-widget--expanded:not(.delete-widget--collapsing) .delete-widget__trigger {
      opacity: 0;
      pointer-events: none;
    }

    .delete-widget--collapsing .delete-widget__trigger {
      opacity: 1;
      pointer-events: auto;
    }

    .delete-widget__icon-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      width: 24px;
      height: 18px;
      overflow: visible;
      transform: translateY(-3px);
      transition: transform 200ms ease;
    }

    .delete-widget__icon {
      display: block;
      width: 24px;
      height: 24px;
      overflow: visible;
      color: var(--btn-fg);
    }

    .delete-widget__label {
      color: var(--btn-fg);
      display: block;
      line-height: 18px;
      height: 18px;
      transform: translateY(4px);
    }

    .delete-widget__label.btn-text {
      display: block;
      flex-direction: unset;
      text-box-trim: none;
      text-box-edge: auto;
    }

    .bin-lid {
      transform-origin: right center;
      transition: transform 200ms ease;
    }

    .delete-widget:not(.delete-widget--expanded):has(.delete-widget__trigger:hover) .bin-lid,
    .delete-widget:not(.delete-widget--expanded):has(.delete-widget__trigger:focus-visible) .bin-lid {
      transform: rotate(35deg);
    }

    .delete-widget:not(.delete-widget--expanded):has(.delete-widget__trigger:hover) .delete-widget__icon-wrap,
    .delete-widget:not(.delete-widget--expanded):has(.delete-widget__trigger:focus-visible) .delete-widget__icon-wrap {
      transform: translateY(0);
    }

    .delete-widget__confirm {
      position: absolute;
      inset: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 150ms ease 0ms;
    }

    .delete-widget--expanded .delete-widget__confirm {
      inset: 8px 48px;
    }

    .delete-widget--expanded:not(.delete-widget--collapsing) .delete-widget__confirm {
      opacity: 1;
      pointer-events: auto;
      transition-delay: 0ms;
      transition-duration: 200ms;
    }

    .delete-widget--collapsing .delete-widget__confirm {
      opacity: 0;
      pointer-events: none;
      transition-delay: 0ms;
      transition-duration: 100ms;
    }

    .delete-widget__question {
      color: var(--white);
      white-space: nowrap;
      display: block;
      line-height: 18px;
      height: 18px;
      align-self: center;
    }

    .delete-widget__question.btn-text {
      color: var(--white);
      display: block;
      flex-direction: unset;
      text-box-trim: none;
      text-box-edge: auto;
    }

    .confirm-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      min-width: 44px;
      padding: 12px 24px;
      border: none;
      cursor: pointer;
      white-space: nowrap;
      text-align: center;
      border-radius: var(--radius-rect);
    }

    .confirm-btn--yes {
      background-color: var(--red);
      color: var(--white);
      transition: background-color 150ms ease, color 150ms ease, outline-color 150ms ease;
    }

    .confirm-btn .btn-text {
      display: block;
      width: 100%;
      text-align: center;
      line-height: 18px;
    }

    .confirm-btn:focus {
      outline: none;
    }

    .confirm-btn--yes .btn-text {
      color: var(--white);
    }

    .confirm-btn--yes:hover,
    .confirm-btn--yes:focus-visible {
      background-color: var(--red-hover);
    }

    .confirm-btn--yes:focus-visible {
      outline: 3px solid var(--white);
      outline-offset: 2px;
    }

    .confirm-btn--no {
      background: transparent;
      border: 2px solid var(--white);
      color: var(--white);
      outline: none;
      transition: none;
    }

    .confirm-btn--no .btn-text {
      color: var(--white);
    }

    .confirm-btn--no:hover {
      background: var(--white);
      border-color: var(--purple);
      color: var(--purple);
      transition: background-color 150ms ease, color 150ms ease, border-color 150ms ease;
    }

    .confirm-btn--no:hover .btn-text {
      color: var(--purple);
    }

    .confirm-btn--no:focus-visible {
      background: transparent;
      border-color: var(--white);
      color: var(--white);
      outline: 3px solid var(--white);
      outline-offset: 2px;
    }

    .confirm-btn--no:focus-visible .btn-text {
      color: var(--white);
    }
  </style>
</head>
<body>
  <h1 class="sr-only">Delete confirmation on action bar demo</h1>

  <div class="action-bar" id="action-bar">
    <button type="button" class="bar-btn bar-btn--ghost action-bar__eclipse-target" id="view-document">
      <span class="btn-text">View document</span>
      <svg class="bar-btn__icon" width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="5" y="3" width="12" height="16" rx="1" stroke="currentColor" stroke-width="1.5"/>
        <rect x="8" y="6" width="12" height="16" rx="1" fill="#ffffff" stroke="currentColor" stroke-width="1.5"/>
      </svg>
    </button>

    <div class="action-bar__actions">
      <div class="delete-widget" id="delete-widget">
        <button
          type="button"
          class="delete-widget__trigger"
          id="delete-trigger"
          aria-haspopup="true"
          aria-expanded="false"
        >
          <span class="btn-text delete-widget__label">Delete</span>
          <span class="delete-widget__icon-wrap" aria-hidden="true">
            <svg
              class="delete-widget__icon"
              width="24"
              height="24"
              viewBox="0 -3 20 22"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <g class="bin-lid">
                <rect x="3" y="3" width="14" height="2.5" rx="0.5" fill="currentColor"/>
                <rect x="7.5" y="1" width="5" height="2" rx="0.5" fill="currentColor"/>
              </g>
              <path
                d="M5 6.5h10l-0.8 11.5H5.8L5 6.5z"
                fill="currentColor"
              />
              <line x1="8.5" y1="9" x2="8.5" y2="15" stroke="var(--btn-bg)" stroke-width="1.5" stroke-linecap="round"/>
              <line x1="11.5" y1="9" x2="11.5" y2="15" stroke="var(--btn-bg)" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </span>
        </button>

        <div
          class="delete-widget__confirm"
          id="delete-confirm"
          role="group"
          aria-label="Confirm deletion"
          aria-hidden="true"
        >
          <span class="btn-text delete-widget__question">Are you sure?</span>
          <button
            type="button"
            class="confirm-btn confirm-btn--yes"
            id="confirm-yes"
            aria-label="Yes, confirm deletion"
          ><span class="btn-text">Yes</span></button>
          <button
            type="button"
            class="confirm-btn confirm-btn--no"
            id="confirm-no"
            aria-label="No, cancel deletion"
          ><span class="btn-text">No</span></button>
        </div>
      </div>

      <button type="button" class="bar-btn bar-btn--primary action-bar__eclipse-target" id="upload-new">
        <span class="btn-text">Upload new</span>
        <svg class="bar-btn__icon" width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 5v10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M8 9l4-4 4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M5 19h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </div>

  <script>
    (function () {
      const actionBar = document.getElementById('action-bar');
      const widget = document.getElementById('delete-widget');
      const trigger = document.getElementById('delete-trigger');
      const confirmPanel = document.getElementById('delete-confirm');
      const yesBtn = document.getElementById('confirm-yes');
      const noBtn = document.getElementById('confirm-no');
      const eclipseTargets = actionBar.querySelectorAll('.action-bar__eclipse-target');

      const CONFIRM_FADE_MS = 100;
      const BAR_TRANSITION_MS = 350;

      let collapsedWidth = 0;
      let expandedWidth = 0;
      let isExpanded = false;
      let isCollapsing = false;

      function measureCollapsedWidth() {
        widget.classList.remove('delete-widget--expanded');
        actionBar.classList.remove('action-bar--expanded');
        widget.style.width = '';
        widget.style.left = '';
        widget.style.right = '';
        trigger.setAttribute('aria-expanded', 'false');
        confirmPanel.setAttribute('aria-hidden', 'true');
        eclipseTargets.forEach(function (target) {
          target.removeAttribute('aria-hidden');
        });
        collapsedWidth = widget.offsetWidth;
        expandedWidth = actionBar.offsetWidth;
      }

      function expand() {
        if (isExpanded) return;
        measureCollapsedWidth();
        isExpanded = true;
        actionBar.classList.add('action-bar--expanded');
        eclipseTargets.forEach(function (target) {
          target.setAttribute('aria-hidden', 'true');
        });
        widget.classList.add('delete-widget--expanded');
        trigger.setAttribute('aria-expanded', 'true');
        trigger.tabIndex = -1;
        confirmPanel.setAttribute('aria-hidden', 'false');
        widget.style.width = collapsedWidth + 'px';
        void widget.offsetWidth;
        widget.style.width = expandedWidth + 'px';
        widget.style.left = '0';
        window.setTimeout(function () {
          if (isExpanded) {
            noBtn.focus();
          }
        }, 220);
      }

      function collapse(returnFocus) {
        if (!isExpanded || isCollapsing) return;
        isCollapsing = true;

        widget.classList.add('delete-widget--collapsing');
        confirmPanel.setAttribute('aria-hidden', 'true');

        window.setTimeout(function () {
          widget.style.width = expandedWidth + 'px';
          widget.style.left = '0';
          void widget.offsetWidth;

          actionBar.classList.add('action-bar--retracting');
          trigger.setAttribute('aria-expanded', 'false');
          trigger.tabIndex = 0;
          widget.style.width = collapsedWidth + 'px';
          widget.style.left = '';

          window.setTimeout(function () {
            isExpanded = false;
            isCollapsing = false;
            widget.classList.remove('delete-widget--expanded', 'delete-widget--collapsing');
            actionBar.classList.remove('action-bar--expanded', 'action-bar--retracting');
            widget.style.width = '';
            widget.style.left = '';
            widget.style.right = '';
            eclipseTargets.forEach(function (target) {
              target.removeAttribute('aria-hidden');
            });
            if (returnFocus) {
              trigger.focus();
            }
          }, BAR_TRANSITION_MS);
        }, CONFIRM_FADE_MS);
      }

      function confirmDelete() {
        // TODO: Add real delete logic here (e.g. API call, DOM removal, navigation).
        console.log('Item deleted');
      }

      window.addEventListener('load', measureCollapsedWidth);
      window.addEventListener('resize', function () {
        if (!isExpanded) {
          measureCollapsedWidth();
        }
      });

      trigger.addEventListener('click', expand);

      noBtn.addEventListener('click', function () {
        noBtn.blur();
        collapse(true);
      });

      yesBtn.addEventListener('click', function () {
        collapse(false);
        confirmDelete();
      });

      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape' && isExpanded) {
          event.preventDefault();
          collapse(true);
        }
      });
    })();
  </script>
</body>
</html>
